<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Shopping Cart</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                font-family: system-ui, sans-serif;
                background: #f0f2f5;
                color: #222;
            }
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 16px 24px;
                background: #4f7cff;
                color: #fff;
            }
            header h1 {
                margin: 0;
                font-size: 1.3rem;
            }
            main {
                max-width: 900px;
                margin: 0 auto;
                padding: 24px 16px;
                display: grid;
                gap: 24px;
            }
            @media (min-width: 700px) {
                main {
                    grid-template-columns: 1fr 1fr;
                }
            }
            section {
                background: #fff;
                border-radius: 12px;
                padding: 16px;
            }
            h2 {
                margin-top: 0;
            }
            ul {
                list-style: none;
                margin: 0;
                padding: 0;
            }
            button {
                font: inherit;
                cursor: pointer;
                padding: 6px 12px;
            }
            button:disabled {
                opacity: 0.4;
                cursor: default;
            }
            .product,
            .cart-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 0;
                border-bottom: 1px solid #eceef2;
            }
            .product-image {
                font-size: 2rem;
            }
            .product strong,
            .cart-name {
                flex: 1;
            }
            .quantity {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .empty {
                color: #98a2b3;
                padding: 12px 0;
            }
            .cart-footer {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 16px;
            }
            .cart-actions {
                display: flex;
                gap: 8px;
                margin-top: 12px;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Mama Mboga Shop</h1>
            <div>Cart: <strong id="cart-count">0</strong> items</div>
        </header>

        <main>
            <section>
                <h2>Products</h2>
                <ul id="product-list"></ul>
            </section>

            <section>
                <h2>Your Cart</h2>
                <ul id="cart-items"></ul>
                <div class="cart-footer">
                    <span>Total:</span>
                    <strong id="cart-total">KSh 0</strong>
                </div>
                <div class="cart-actions">
                    <button id="undo-btn" type="button">Undo</button>
                    <button id="clear-btn" type="button">Clear cart</button>
                </div>
            </section>
        </main>

        <script src="cart.js"></script>
    </body>
</html>
